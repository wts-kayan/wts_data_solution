# Oozie job submission properties for the Projection workflow.
# Submit with:
#   oozie job -oozie http://<oozie-host>:11000/oozie -config oozie/job.properties -run

# Make Oozie add the system sharelib (Spark3 jars, etc.) to the action classpath.
# Required so spark-core is present at runtime -> fixes
# NoClassDefFoundError: org/apache/spark/internal/Logging
oozie.use.system.libpath=true

# Use the spark3 sharelib specifically (not the legacy spark/spark2 one).
oozie.action.sharelib.for.spark=spark3
